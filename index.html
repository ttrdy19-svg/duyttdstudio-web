  <header class="site-header">
    <div class="shell">
      <div class="masthead">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">♪</span>
          <span>
            <span class="brand-name">DUY TTD STUDIO</span>
            <span class="masthead-label">Âm nhạc &amp; hình ảnh</span>
          </span>
        </div>
        <div class="tab-row primary-tabs" id="site-tabs" role="tablist" aria-label="Các mục của studio"></div>
      </div>
    </div>
  </header>

  <main class="shell" id="site-panels">
    <noscript>Bật JavaScript để chuyển mục và chọn bài hát.</noscript>

    <div class="shell">
      <span>Duy TTD Studio</span>

      </nav>
    </div>
  </footer>

  <template id="youtube-page">
    <div class="channel-nav">
      <span class="channel-nav-label" aria-hidden="true">Kênh YouTube</span>
      <div class="tab-row channel-tabs" id="channel-tabs" role="tablist" aria-label="Kênh YouTube của studio"></div>
    </div>
    <section id="channel-panel" role="tabpanel" tabindex="0">
      <div class="channel-hero">
        <div>
          <p class="eyebrow" id="channel-style"></p>
          <h1 class="hero-title" id="channel-title"></h1>
          <p class="hero-copy" id="channel-description"></p>
          <div class="actions">
            <button class="button button-primary" type="button" id="listen-now">▶ Nghe ngay</button>
            <a class="button button-quiet" id="channel-link" target="_blank" rel="noopener noreferrer">Mở kênh YouTube ↗</a>
            <button class="button button-quiet" type="button" id="contact-action">Liên hệ</button>
          </div>
          <p class="hero-handle" id="channel-handle"></p>
        </div>
        <div class="hero-record" aria-hidden="true"><span></span><span></span></div>
      </div>

      <div class="listening-layout">
        <section class="player-column" aria-labelledby="selected-title">
          <div class="media-frame" id="player">
            <button class="media-cover" id="media-cover" type="button">
              <span class="cover-play" aria-hidden="true">▶</span>
              <span class="cover-caption"></span>
            </button>
            <iframe id="youtube-player" hidden title="Trình phát YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          </div>
          <div class="selection">
            <p class="eyebrow">Bài đang chọn</p>
            <h2 id="selected-title" tabindex="-1"></h2>
            <p class="track-meta" id="selected-meta"></p>
            <div class="actions">
              <button class="button button-primary" type="button" id="play-track">▶ Phát</button>
              <button class="button button-quiet" type="button" id="previous-track">‹ Bài trước</button>
              <button class="button button-quiet" type="button" id="next-track">Bài tiếp ›</button>
              <button class="button button-quiet" type="button" id="shuffle-track">Trộn bài</button>
              <a class="button button-quiet" id="popup-track" target="_blank" rel="noopener">Cửa sổ nổi ↗</a>
            </div>
            <p class="player-status" id="player-status" role="status"></p>
            <a class="watch-link" id="watch-track" target="_blank" rel="noopener noreferrer">Xem trên YouTube ↗</a>
          </div>
        </section>

        <section class="library" aria-labelledby="library-title">
          <div class="library-heading">
            <h2 id="library-title">Bài hát nổi bật</h2>
            <span class="sample-pill" id="data-stamp">Video trên kênh</span>
          </div>
          <div class="search-box">
            <label for="song-search">Tìm bài hát</label>
            <input type="search" id="song-search" placeholder="Nhập tên bài hoặc thể loại…" autocomplete="off">
          </div>
          <p class="results-count" id="results-count" role="status"></p>
          <div class="track-grid" id="track-grid"></div>
        </section>
      </div>
    </section>
  </template>

  <template id="music-page">
    <p>Khám phá các bản thu và MV đã phát hành trên 5 kênh YouTube của studio.</p>
    <button class="button button-primary" type="button" data-open-youtube>Nghe nhạc và xem MV</button>
  </template>
